[project]
name = "orchestrix-backend"
version = "0.1.0"
description = "Orchestrix AI Backend Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.1",
    "authlib>=1.9.5",
    "pyjwt>=2.15.1",
    "cryptography>=50.0.2",
    "tree-sitter>=0.26.1",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-c>=0.24.2",
    "tree-sitter-cpp>=0.23.4",
    "tree-sitter-php>=0.25.1",
    "tree-sitter-c-sharp>=0.23.5",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-swift>=0.7.4",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-dart>=0.1.0",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-css>=0.25.0",
    "tree-sitter-sql>=0.3.13",
    "tree-sitter-svelte>=1.0.2",
    "tree-sitter-yaml>=0.7.2",
    "tree-sitter-xml>=0.7.0",
    "tree-sitter-bash>=0.25.1",
    "tree-sitter-powershell>=0.26.4",
    "tree-sitter-lua>=0.5.0",
    "tree-sitter-scala>=0.26.13",
    "tree-sitter-elixir>=0.3.5",
    "tree-sitter-haskell>=0.24.1",
    "tree-sitter-perl>=2.0.6",
    "tree-sitter-objc>=3.0.2",
    "tree-sitter-ocaml>=0.26.0",
    "tree-sitter-julia>=0.23.1",
    "tree-sitter-zig>=1.1.2",
    "tree-sitter-solidity>=1.2.13",
    "tree-sitter-groovy>=0.1.2",
    "tree-sitter-fortran>=0.6.0",
    "tree-sitter-cmake>=0.7.2.post1",
    "tree-sitter-make>=1.1.1",
    "tree-sitter-markdown>=0.5.4",
    "tree-sitter-toml>=0.7.0",
    "tree-sitter-json>=0.24.8",
    "tree-sitter-pascal>=0.11.0",
    "pgvector>=0.5.1",
    "fastembed>=0.9.1",
    "neo4j>=6.4.1",
    "coverage>=7.17.3",
    "pip-audit>=2.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["E501", "W291"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
]
